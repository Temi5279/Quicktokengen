<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Base64 Encoder & Decoder | QuickTokenGen</title>
    <meta name="description" content="Encode strings into Base64 or decode Base64 back to plain text instantly in your browser. Fast, free developer utility.">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            background-color: #0f172a; color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px;
        }

        .navbar {
            display: flex; gap: 10px; background-color: #1e293b; padding: 8px 12px;
            border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155;
            max-width: 550px; width: 100%; justify-content: center; flex-wrap: wrap;
        }
        .nav-link { color: #94a3b8; text-decoration: none; padding: 8px 14px; font-size: 0.88rem; font-weight: 700; border-radius: 8px; }
        .nav-link.active, .nav-link:hover { background-color: #38bdf8; color: #0f172a; }

        .container {
            background-color: #1e293b; padding: 30px; border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4); width: 100%;
            max-width: 550px; text-align: center; margin-bottom: 30px; border: 1px solid #334155;
        }

        h1 { font-size: 1.6rem; margin-top: 0; margin-bottom: 25px; color: #38bdf8; font-weight: 800; }

        textarea {
            width: 100%; background-color: #0f172a; border: 1px solid #334155;
            color: #f8fafc; padding: 14px; border-radius: 8px; font-size: 1rem; margin-bottom: 18px;
        }

        .action-btn {
            background-color: #38bdf8; color: #0f172a; border: none; padding: 12px 18px;
            font-size: 0.95rem; font-weight: 800; border-radius: 8px; cursor: pointer; width: 48%; text-transform: uppercase;
        }

        .copy-btn {
            background-color: #334155; color: #e2e8f0; border: none; padding: 8px 14px;
            font-size: 0.85rem; font-weight: 700; border-radius: 6px; cursor: pointer;
        }

        .seo-section { max-width: 750px; text-align: left; border-top: 1px solid #334155; padding: 40px 20px; line-height: 1.7; color: #94a3b8; }
        .seo-section h2 { color: #38bdf8; font-size: 1.3rem; margin-top: 25px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="/" class="nav-link">Password</a>
        <a href="/qr-code/" class="nav-link">QR Code</a>
        <a href="/text-repeater/" class="nav-link">Repeater</a>
        <a href="/base64/" class="nav-link active">Base64</a>
    </nav>

    <div class="container">
        <h1>Base64 Encoder & Decoder</h1>
        <textarea id="base64-input" rows="4" placeholder="Type or paste text here..."></textarea>
        
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <button class="action-btn" onclick="encodeBase64()">Encode</button>
            <button class="action-btn" style="background-color:#a855f7; color:white;" onclick="decodeBase64()">Decode</button>
        </div>
        
        <div id="base64-result-wrapper" style="display:none; text-align: left;">
            <div style="text-align: right; margin-bottom: 10px;">
                <button class="copy-btn" id="base64-copy-btn" onclick="copyBase64()">Copy Result</button>
            </div>
            <textarea id="base64-output" rows="4" readonly></textarea>
        </div>
    </div>

    <div class="seo-section">
        <h2>Instant Online Base64 Converter Tool</h2>
        <p>Encode plain text strings into binary-to-text Base64 format, or decode Base64 encoded strings back to human-readable text. Ideal for developers, API testing, and data conversion.</p>
    </div>

    <script>
        function encodeBase64() {
            const input = document.getElementById('base64-input').value;
            const output = document.getElementById('base64-output');
            const wrapper = document.getElementById('base64-result-wrapper');
            if(!input) return;
            try {
                output.value = btoa(unescape(encodeURIComponent(input)));
                wrapper.style.display = 'block';
            } catch(e) { alert("Encoding error!"); }
        }

        function decodeBase64() {
            const input = document.getElementById('base64-input').value;
            const output = document.getElementById('base64-output');
            const wrapper = document.getElementById('base64-result-wrapper');
            if(!input) return;
            try {
                output.value = decodeURIComponent(escape(atob(input)));
                wrapper.style.display = 'block';
            } catch(e) { alert("Invalid Base64 string!"); }
        }

        function copyBase64() {
            const text = document.getElementById('base64-output').value;
            const btn = document.getElementById('base64-copy-btn');
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = "✓ Copied";
                btn.style.backgroundColor = "#22c55e";
                setTimeout(() => { btn.innerText = "Copy Result"; btn.style.backgroundColor = ""; }, 1500);
            });
        }
    </script>
</body>
</html>
